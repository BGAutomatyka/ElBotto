[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elbotto"
version = "0.1.0"
description = "GUI dla bota tradingowego ElBo"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "matplotlib>=3.8"
]

[tool.setuptools]
packages = ["elbotto"]
include-package-data = true
