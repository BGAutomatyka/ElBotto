name: build-elbotto
on:
  workflow_dispatch: {}
  push:
    branches: [ foundation/mvp ]
jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyinstaller PySide6 pyyaml
      - name: Package
        run: python scripts/package_win.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElBotto-win
          path: dist/ElBotto.exe
