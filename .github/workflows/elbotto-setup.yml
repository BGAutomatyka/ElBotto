name: ElBotto Setup Installer
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create folders
        run: |
          mkdir -p docs/js

      - name: Add docs/js/disclaimer.js
        run: |
          cat > docs/js/disclaimer.js <<'EOF'
// docs/js/disclaimer.js
(()=> {
  if (document.getElementById('elbotto-disclaimer')) return;
  const style = document.createElement('style');
  style.textContent = `
    #elbotto-disclaimer{margin:16px auto 0;max-width:1200px;color:#64748b;font-size:12px;line-height:1.4}
    #elbotto-disclaimer .box{border:1px solid #e5e7eb;background:#fff;border-radius:10px;padding:10px}
  `;
  document.head.appendChild(style);
  const wrap = document.createElement('div');
  wrap.id = 'elbotto-disclaimer';
  wrap.innerHTML = `
    <div class="box">
      <b>Disclaimer:</b> Materiał edukacyjny. To nie jest rekomendacja inwestycyjna
      ani porada finansowa. Handel aktywami cyfrowymi wiąże się z ryzykiem
      utraty kapitału. Używaj wyłącznie środków, na których stratę możesz sobie pozwolić.
    </div>`;
  (document.querySelector('.wrap') || document.body).appendChild(wrap);
})();
EOF

      - name: Add docs/js/presets.js
        run: |
          cat > docs/js/presets.js <<'EOF'
// docs/js/presets.js
const KEY = 'elbotto.presets.strategyLab.v1';
function $(sel){ return document.querySelector(sel); }
function collect(){
  const ids = ['symbol','interval','bars','strategy','p_fee','p_slip','p_units','p_use_sl','p_sl','p_use_tp','p_tp','p_use_tr','p_tr','p_fast','p_slow','p_len','p_os','p_ob','p_mult'];
  const cfg = {};
  ids.forEach(id => { const el=document.getElementById(id); if(el){ cfg[id] = el.type==='checkbox' ? el.checked : el.value; }});
  return cfg;
}
function apply(cfg){
  if(!cfg) return;
  Object.entries(cfg).forEach(([id,val]) => {
    const el=document.getElementById(id); if(!el) return;
    if(el.type==='checkbox') el.checked=!!val; else el.value=val;
  });
}
function ui(){
  const status = $('#status'); if(!status) return;
  const grp = document.createElement('span'); grp.style.marginLeft='8px';
  grp.innerHTML = `<button id="pz_save" title="Zapisz ustawienia do przeglądarki">Save</button>
                   <button id="pz_load" title="Wczytaj zapisane ustawienia">Load</button>
                   <button id="pz_reset" title="Wyczyść presety">Reset</button>`;
  status.after(grp);
  $('#pz_save').onclick = ()=>{ localStorage.setItem(KEY, JSON.stringify(collect())); status.textContent='● saved'; };
  $('#pz_load').onclick = ()=>{ apply(JSON.parse(localStorage.getItem(KEY)||'null')); };
  $('#pz_reset').onclick = ()=>{ localStorage.removeItem(KEY); };
}
apply(JSON.parse(localStorage.getItem(KEY)||'null')); ui();
EOF

      - name: Add docs/js/binance-lite.js
        run: |
          cat > docs/js/binance-lite.js <<'EOF'
// docs/js/binance-lite.js
export const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));
export const mapK = a => a.map(k=>({t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5]}));
export async function fetchKlines(symbol, interval, candles=200){
  const out=[]; let end=null;
  while(out.length < candles){
    const need=candles - out.length; const limit=Math.min(1000, need);
    const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}` + (end?`&endTime=${end}`:'');
    const json = await fetch(url).then(r=>r.json());
    if(!Array.isArray(json) || !json.length) break;
    const batch = mapK(json);
    if(out.length && batch[0]?.t === out[0]?.t) break;
    out.unshift(...batch);
    end = batch[0].t - 1;
    await sleep(70);
    if(batch.length < limit) break;
  }
  return out.slice(-candles);
}
EOF

      - name: Add docs/js/svg-charts.js
        run: |
          cat > docs/js/svg-charts.js <<'EOF'
// docs/js/svg-charts.js
export function spark(svg, series){
  if(!svg || !series?.length){ svg.innerHTML=''; return; }
  const W=300, H=80, n=series.length, xs=W/(n-1);
  const min=Math.min(...series), max=Math.max(...series), pad=(max-min)*0.05||1;
  const yMin=min-pad, yMax=max+pad;
  const Y=v=> H - ((v-yMin)/(yMax-yMin))*H;
  let d=`M 0 ${Y(series[0])}`;
  for(let i=1;i<n;i++){ d+=` L ${i*xs} ${Y(series[i])}` }
  const up = series[n-1] >= series[0];
  const col = up ? '#10b981' : '#ef4444';
  svg.setAttribute('viewBox','0 0 300 80');
  svg.innerHTML = `<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/><path d="${d}" stroke="${col}" stroke-width="2" fill="none"/>`;
}
EOF

      - name: Add docs/watchlist.html
        run: |
          cat > docs/watchlist.html <<'EOF'
<!doctype html><html lang="pl"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElBotto — Watchlista</title>
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self';
           connect-src 'self' https://api.binance.com;
           img-src 'self' data:;
           script-src 'self' 'unsafe-inline';
           style-src 'self' 'unsafe-inline';
           base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
<style>
  :root{--bg:#f6f7fb;--card:#fff;--muted:#6b7280}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:#0f172a}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #e5e7eb}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1200px;margin:12px auto;padding:0 12px}
  .card{background:var(--card);border:1px solid #e5e7eb;border-radius:14px;padding:10px;cursor:pointer}
  .row{display:flex;justify-content:space-between;align-items:center}
  .muted{color:var(--muted);font-size:12px}
  .price{font-weight:700}
</style>
<header>
  <div><b>ElBotto — Watchlista</b><div class="muted">Mini-wykresy + zmiana 1m (REST)</div></div>
  <div class="row" style="gap:8px;padding-right:8px">
    <label>Interwał <select id="tf"><option>1m</option><option>5m</option><option>15m</option></select></label>
    <label>Świec <input id="bars" type="number" value="120" min="60" max="1000" style="width:80px"></label>
    <button id="refresh">Przeładuj</button>
  </div>
</header>
<div class="grid" id="grid"></div>
<script type="module">
  import {fetchKlines} from './js/binance-lite.js';
  import {spark} from './js/svg-charts.js';
  const grid=document.getElementById('grid');
  const tf=document.getElementById('tf');
  const bars=document.getElementById('bars');
  const btn=document.getElementById('refresh');
  const symbols=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT'];
  function card(sym){
    const el=document.createElement('div'); el.className='card';
    el.innerHTML=`
      <div class="row"><div><b>${sym}</b> <span class="muted">Binance</span></div>
           <div class="price" id="p-${sym}">—</div></div>
      <svg id="s-${sym}" viewBox="0 0 300 80" preserveAspectRatio="none"></svg>
      <div class="muted" id="c-${sym}"></div>
    `;
    el.onclick=()=>location.href=`./strategy-lab.html`;
    return el;
  }
  symbols.forEach(s=>grid.appendChild(card(s)));
  async function loadOne(sym){
    const data = await fetchKlines(sym, tf.value, +bars.value);
    const series = data.map(d=>d.c);
    spark(document.getElementById(`s-${sym}`), series);
    const last = series.at(-1);
    const chg = ((last - series[0]) / series[0] * 100).toFixed(2);
    document.getElementById(`p-${sym}`).textContent = last.toFixed(2);
    document.getElementById(`c-${sym}`).textContent = `Zmiana: ${chg}% • ${tf.value} • ${bars.value} świec`;
  }
  async function loadAll(){ for(const s of symbols) await loadOne(s); }
  btn.onclick=loadAll; loadAll(); setInterval(loadAll, 10000);
</script>
<script type="module" src="./js/disclaimer.js"></script>
</html>
EOF

      - name: Patch docs/strategy-lab.html (CSP + scripts)
        run: |
          if [ -f docs/strategy-lab.html ]; then
            # Insert CSP meta after <title> if not present
            if ! grep -q "Content-Security-Policy" docs/strategy-lab.html; then
              sed -i '0,/<title>/s//&\n<meta http-equiv="Content-Security-Policy"\n  content="default-src '\''self'\'';\n           connect-src '\''self'\'' https:\/\/api.binance.com wss:\/\/stream.binance.com:9443;\n           img-src '\''self'\'' data:;\n           script-src '\''self'\'' '\''unsafe-inline'\'';\n           style-src '\''self'\'' '\''unsafe-inline'\'';\n           base-uri '\''none'\'';\n           form-action '\''self'\'';\n           frame-ancestors '\''none'\'';\n           upgrade-insecure-requests">/' docs/strategy-lab.html
            fi
            # Inject presets & disclaimer scripts before </html>
            if ! grep -q "js/presets.js" docs/strategy-lab.html; then
              sed -i 's#</html>#<script type="module" src="js/presets.js"></script>\n<script type="module" src="js/disclaimer.js"></script>\n</html>#' docs/strategy-lab.html
            fi
          fi

      - name: Patch docs/index.html (nav link to Watchlista)
        run: |
          if [ -f docs/index.html ]; then
            if ! grep -q 'watchlist.html' docs/index.html; then
              # try to add to existing nav paragraph; else append block near top
              if grep -q '<p' docs/index.html; then
                sed -i '0,/<p[^>]*>/s//&\n  <a href="watchlist.html">Watchlista<\/a> · /' docs/index.html || true
              else
                sed -i '1i <p style="margin-top:8px"><a href="watchlist.html">Watchlista<\/a><\/p>' docs/index.html
              fi
            fi
          fi

      - name: Git commit & push
        run: |
          git config user.name "elbotto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(setup): add disclaimer, presets, shared js and watchlist; patch CSP & links" || echo "No changes"
          git push
