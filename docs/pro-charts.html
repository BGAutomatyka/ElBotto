<!doctype html><html lang="pl"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElBotto — PRO Charts (SVG)</title>
<style>
  :root{--bg:#f6f7fb;--card:#fff;--muted:#6b7280;--grid:#eef0f5;--up:#10b981;--dn:#ef4444;--sma:#0ea5e9;--ema:#a855f7;--macd1:#f59e0b;--macd2:#fb923c}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:#0f172a}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,button{border:1px solid #d1d5db;border-radius:8px;padding:6px 8px;background:#fff;cursor:pointer}
  .wrap{max-width:1200px;margin:0 auto;padding:12px}
  .card{background:var(--card);border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:12px}
  #main{width:100%;height:440px} #osc{width:100%;height:200px} #eq{width:100%;height:140px}
  .muted{color:var(--muted);font-size:12px}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0}
  .stat{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:6px 10px;font-size:12px}
  pre{white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px}
</style>

<header>
  <div>
    <h1 style="margin:0;font-size:20px">ElBotto — PRO Charts</h1>
    <div class="muted">Binance REST + WebSocket • świece + SMA/EMA + MACD + RSI • Markery, Log, Export CSV</div>
  </div>
  <div class="row">
    <label>Tryb
      <select id="mode"><option value="binance">Binance</option><option value="sim">Symulacja</option></select>
    </label>
    <label>Symbol
      <select id="symbol"><option>BTCUSDT</option><option>ETHUSDT</option><option>BNBUSDT</option><option>SOLUSDT</option></select>
    </label>
    <label>Interwał
      <select id="interval"><option>1m</option><option>5m</option><option>15m</option><option>1h</option></select>
    </label>
    <button id="reload">Przeładuj</button>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <button id="reset">Reset</button>
    <button id="export">Export CSV</button>
    <span id="status" class="muted">● offline</span>
  </div>
</header>

<div class="wrap">
  <div class="stats">
    <div class="stat">Pozycja: <b id="pos">FLAT</b></div>
    <div class="stat">Cena: <b id="px">—</b></div>
    <div class="stat">Equity: <b id="eqv">10000.00</b></div>
    <div class="stat">PnL otw.: <b id="upnl">0.00</b></div>
    <div class="stat">Transakcji: <b id="tradesCnt">0</b></div>
  </div>

  <div class="card"><svg id="main" viewBox="0 0 1200 440" preserveAspectRatio="none"></svg></div>
  <div class="card"><svg id="osc"  viewBox="0 0 1200 200" preserveAspectRatio="none"></svg></div>
  <div class="card"><svg id="eq"   viewBox="0 0 1200 140" preserveAspectRatio="none"></svg></div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="muted">Log transakcji</div>
      <button id="clearLog">Wyczyść log</button>
    </div>
    <pre id="log"></pre>
  </div>
</div>

<script>
(function(){
  const elMain = document.getElementById('main');
  const elOsc  = document.getElementById('osc');
  const elEq   = document.getElementById('eq');
  const statusEl=document.getElementById('status');
  const modeSel=document.getElementById('mode');
  const symSel =document.getElementById('symbol');
  const intSel =document.getElementById('interval');
  const btnReload=document.getElementById('reload');
  const btnStart=document.getElementById('start');
  const btnStop =document.getElementById('stop');
  const btnReset=document.getElementById('reset');
  const btnExport=document.getElementById('export');
  const btnClearLog=document.getElementById('clearLog');
  const posEl=document.getElementById('pos'), pxEl=document.getElementById('px'), eqvEl=document.getElementById('eqv'), upnlEl=document.getElementById('upnl'), tradesCntEl=document.getElementById('tradesCnt');
  const logEl=document.getElementById('log');

  let ws=null, simTimer=null, running=true;
  let mode = (localStorage.pro_mode||'binance'), symbol=(localStorage.pro_symbol||'BTCUSDT'), interval=(localStorage.pro_interval||'1m');
  modeSel.value=mode; symSel.value=symbol; intSel.value=interval;

  let data=[];           // candles: {t,o,h,l,c,v}
  let equity=[{t:Math.floor(Date.now()/1000), v:10000}];
  let position='FLAT';   // FLAT/LONG
  let entryPx=0;
  let trades=[];         // {time,type,price,size,equity}
  let logs=[];

  function setStatus(ok,msg=''){ statusEl.textContent=(ok?'● connected':'● offline')+(msg?' — '+msg:''); statusEl.style.color = ok? '#16a34a':'#ef4444' }
  function addLog(s){ logs.push(s); if(logs.length>400) logs.shift(); logEl.textContent = logs.join('\n'); }
  function savePrefs(){ localStorage.pro_mode=modeSel.value; localStorage.pro_symbol=symSel.value; localStorage.pro_interval=intSel.value; }

  const mapK = a => a.map(k=>({t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5]}));
  function smaC(n){ const out=[]; let sum=0; for(let i=0;i<data.length;i++){ sum+=data[i].c; if(i>=n) sum-=data[i-n].c; if(i>=n-1) out.push({t:data[i].t, v:sum/n}); } return out }
  function emaC(n){ const out=[]; const k=2/(n+1); if(!data.length) return out; let e=data[0].c; for(let i=0;i<data.length;i++){ e=i?(data[i].c*k + e*(1-k)):data[0].c; out.push({t:data[i].t, v:e}); } return out }
  function rsi(n=14){ if(data.length<n+1) return []; const out=[]; let g=0,l=0; for(let i=1;i<=n;i++){ const d=data[i].c-data[i-1].c; if(d>0) g+=d; else l-=d; } let avgG=g/n, avgL=l/n; out.push({t:data[n].t, v:100-100/(1+(avgG/(avgL||1e-9)))});
    for(let i=n+1;i<data.length;i++){ const d=data[i].c-data[i-1].c; const G=d>0?d:0, L=d<0?-d:0; avgG=(avgG*(n-1)+G)/n; avgL=(avgL*(n-1)+L)/n; out.push({t:data[i].t, v:100-100/(1+(avgG/(avgL||1e-9)))}) } return out }
  function macd(){ if(!data.length) return {m:[],s:[],h:[]}; const ema12=emaC(12).map(x=>x.v), ema26=emaC(26).map(x=>x.v);
    const m=data.map((d,i)=> (ema12[i]??d.c) - (ema26[i]??d.c) );
    const s=[]; const k=2/(9+1); let e=m[0]||0; for(let i=0;i<m.length;i++){ e = i? (m[i]*k + e*(1-k)) : m[0]; s.push(e) }
    const h=m.map((v,i)=> v - s[i]); return {m,s,h}
  }

  function strategySignal(){
    if(data.length<55) return 'HOLD';
    const ema21 = emaC(21), ema50 = emaC(50); const r = rsi(14);
    const i = Math.min(ema21.length, ema50.length, r.length) - 1; if(i<1) return 'HOLD';
    const upCross   = ema21[i].v>ema50[i].v && ema21[i-1].v<=ema50[i-1].v && r[i].v>50;
    const downCross = ema21[i].v<ema50[i].v && ema21[i-1].v>=ema50[i-1].v && r[i].v<50;
    if(upCross) return 'BUY';
    if(downCross) return 'FLAT';
    return 'HOLD';
  }

  function markTrade(type, price){
    const W=1200, H=440, N=data.length, xStep=W/(N-1);
    const min=Math.min(...data.map(d=>d.l)), max=Math.max(...data.map(d=>d.h));
    const pad=(max-min)*0.05||1, yMin=min-pad, yMax=max+pad, Y=v=> H-((v-yMin)/(yMax-yMin))*H;
    const i=N-1, x=i*xStep, y=Y(price), col=(type==='BUY'?'var(--up)':'var(--dn)');
    elMain.insertAdjacentHTML('beforeend', `<polygon points="${x-6},${y+8} ${x+6},${y+8} ${x},${y-6}" fill="${col}" stroke="#00000011"/>`);
  }

  function onNewPrice(p){
    pxEl.textContent = p.toFixed(2);
    if(position==='LONG'){ const pnl = (p - entryPx); upnlEl.textContent = pnl.toFixed(2); }
    tradesCntEl.textContent = trades.length.toString();
  }

  function goLong(p){
    if(position!=='FLAT') return;
    position='LONG'; entryPx=p; posEl.textContent='LONG';
    trades.push({time:data.at(-1).t, type:'BUY', price:p, size:1, equity:equity.at(-1).v});
    addLog(`BUY @ ${p.toFixed(2)} (${new Date().toLocaleTimeString()})`);
    markTrade('BUY', p);
  }
  function goFlat(p){
    if(position==='FLAT') return;
    const pnl = (p - entryPx);
    const newEq = equity.at(-1).v + pnl;
    equity.push({t:data.at(-1).t, v:newEq});
    position='FLAT'; entryPx=0; posEl.textContent='FLAT'; upnlEl.textContent='0.00';
    trades.push({time:data.at(-1).t, type:'SELL', price:p, size:1, equity:newEq});
    addLog(`SELL @ ${p.toFixed(2)} | PnL ${pnl.toFixed(2)} | Eq ${newEq.toFixed(2)}`);
    markTrade('SELL', p);
    renderEq();
  }

  function renderMain(){
    const W=1200,H=440,N=data.length; elMain.innerHTML='';
    if(N<2){ elMain.innerHTML='<text x="12" y="22" fill="#9ca3af" font-size="12">Brak danych…</text>'; return }
    const min=Math.min(...data.map(d=>d.l)), max=Math.max(...data.map(d=>d.h));
    const pad=(max-min)*0.05||1, yMin=min-pad, yMax=max+pad, xStep=W/(N-1), Y=v=> H-((v-yMin)/(yMax-yMin))*H;
    let parts=[`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`];
    for(let i=1;i<6;i++){ const y=i*(H/6); parts.push(`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--grid)"/>`) }
    for(let i=0;i<N;i++){
      const d=data[i], x=i*xStep, yO=Y(d.o), yC=Y(d.c), yH=Y(d.h), yL=Y(d.l);
      const up=d.c>=d.o, col=up?'var(--up)':'var(--dn)';
      const w=Math.max(1.5, xStep*0.6), x0=x-w/2, yB=Math.min(yO,yC), h=Math.max(1, Math.abs(yC-yO));
      parts.push(`<line x1="${x}" y1="${yH}" x2="${x}" y2="${yL}" stroke="${col}" stroke-width="1"/>`);
      parts.push(`<rect x="${x0}" y="${yB}" width="${w}" height="${h}" fill="${col}" opacity="0.9"/>`);
    }
    function lineFrom(vals){ if(!vals.length) return ''; let d=`M 0 ${Y(vals[0].v)}`; for(let i=1;i<vals.length;i++){ d+=` L ${(i*xStep)} ${Y(vals[i].v)}` } return d }
    const sma = smaC(50), ema = emaC(21);
    if(sma.length) parts.push(`<path d="${lineFrom(sma)}" stroke="var(--sma)" stroke-width="1.8" fill="none"/>`);
    if(ema.length) parts.push(`<path d="${lineFrom(ema)}" stroke="var(--ema)" stroke-width="1.6" fill="none"/>`);
    elMain.innerHTML = parts.join('');
  }

  function renderOsc(){
    const W=1200,H=200,N=data.length; elOsc.innerHTML='';
    if(N<30){ elOsc.innerHTML='<text x="12" y="22" fill="#9ca3af" font-size="12">Za mało danych do oscylatorów…</text>'; return }
    let parts=[`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`];
    const {m,s,h}=macd(); const xStep=W/(N-1);
    const maxAbs=Math.max(...h.map(v=>Math.abs(v)||0),1e-6), mid=H*0.45, scale=(H*0.35)/maxAbs;
    for(let i=0;i<N;i++){ const v=h[i]; if(v==null) continue; const bar=v*scale; const y=bar<0?mid:(mid-bar); const hh=Math.abs(bar);
      parts.push(`<rect x="${i*xStep-1}" y="${y}" width="2" height="${hh}" fill="${v>=0?'var(--macd1)':'var(--macd2)'}" opacity="0.85"/>`);}
    function pathLine(arr, lo, hi){ const Y=v=> H - ((v-lo)/(hi-lo))*H; let d='', st=false; for(let i=0;i<arr.length;i++){ const v=arr[i]; if(v==null) continue; const x=i*xStep, y=Y(v); d+= st?` L ${x} ${y}`:`M ${x} ${y}`; st=true } return d }
    const mm=Math.max(...m), mn=Math.min(...m), lo=Math.min(mn,-maxAbs), hi=Math.max(mm,maxAbs);
    parts.push(`<path d="${pathLine(m,lo,hi)}" stroke="var(--macd1)" stroke-width="1.6" fill="none"/>`);
    parts.push(`<path d="${pathLine(s,lo,hi)}" stroke="var(--macd2)" stroke-width="1.2" fill="none"/>`);
    const r = rsi(14); if(r.length){ const rW=r.map(x=>x.v), xS=W/(rW.length-1), Y=v=> H - (v/100)*H;
      let d=`M 0 ${Y(rW[0])}`; for(let i=1;i<rW.length;i++){ d+=` L ${i*xS} ${Y(rW[i])}` }
      parts.push(`<rect x="0" y="${Y(70)}" width="${W}" height="1" fill="#e5e7eb"/>`);
      parts.push(`<rect x="0" y="${Y(30)}" width="${W}" height="1" fill="#e5e7eb"/>`);
      parts.push(`<path d="${d}" stroke="#8b5cf6" stroke-width="1.4" fill="none"/>`);
    }
    elOsc.innerHTML = parts.join('');
  }

  function renderEq(){
    const W=1200,H=140, N=equity.length; elEq.innerHTML='';
    let parts=[`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`];
    if(N<2){ elEq.innerHTML=parts.join(''); return }
    const min=Math.min(...equity.map(e=>e.v)), max=Math.max(...equity.map(e=>e.v));
    const pad=(max-min)*0.05||1, yMin=min-pad, yMax=max+pad, xStep=W/(N-1), Y=v=> H-((v-yMin)/(yMax-yMin))*H;
    let d=`M 0 ${Y(equity[0].v)}`; for(let i=1;i<N;i++){ d+=` L ${i*xStep} ${Y(equity[i].v)}` }
    parts.push(`<path d="${d}" stroke="#0ea5e9" stroke-width="2" fill="none"/>`);
    elEq.innerHTML=parts.join('');
  }

  function renderAll(){ renderMain(); renderOsc(); renderEq(); }

  async function seedBinance(){
    const url=`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=500`;
    const res=await fetch(url); const arr=await res.json();
    if(!Array.isArray(arr)) throw new Error('REST != array');
    data=mapK(arr); renderAll();
  }
  function openWS(){
    try{ ws && ws.close() }catch{}; const stream=`${symbol.toLowerCase()}@kline_${interval}`;
    ws=new WebSocket(`wss://stream.binance.com:9443/ws/${stream}`);
    ws.onopen=()=>setStatus(true,`${symbol}/${interval}`);
    ws.onmessage=ev=>{ if(!running) return; try{
      const k=JSON.parse(ev.data).k; const t=+k.t; const obj={t, o:+k.o, h:+k.h, l:+k.l, c:+k.c, v:+k.v};
      const last=data[data.length-1]; if(last&&last.t===t) data[data.length-1]=obj; else data.push(obj);
      if(data.length>2000) data.shift(); onTick(obj.c);
    }catch{} };
    ws.onclose=()=>{ setStatus(false); if(mode==='binance') setTimeout(openWS,1500) };
    ws.onerror=()=> setStatus(false,'error');
  }

  function startSim(){
    stopSim(); setStatus(true,'sim');
    let t=Math.floor(Date.now()/1000)-500*60; let price=100; data=[];
    for(let i=0;i<300;i++){ const o=price, c=o+(Math.random()-0.5)*1.2, h=Math.max(o,c)+Math.random()*0.8, l=Math.min(o,c)-Math.random()*0.8; data.push({t, o,h,l,c, v:1}); t+=60; price=c }
    renderAll();
    simTimer=setInterval(()=>{ if(!running) return; t+=60; const o=price, c=o+(Math.random()-0.5)*1.2, h=Math.max(o,c)+Math.random()*0.8, l=Math.min(o,c)-Math.random()*0.8; const obj={t,o,h,l,c,v:1}; data.push(obj); if(data.length>2000) data.shift(); onTick(c) }, 500);
  }
  function stopSim(){ if(simTimer){ clearInterval(simTimer); simTimer=null } }

  function onTick(p){
    pxEl.textContent = p.toFixed(2);
    const sig = strategySignal();
    if(sig==='BUY') goLong(p);
    else if(sig==='FLAT') goFlat(p);
    renderAll();
  }

  async function reload(){
    running=true; savePrefs();
    stopSim(); if(ws){ try{ws.close()}catch{} ws=null }
    setStatus(false,'seed');
    if(modeSel.value==='binance'){ try{ await seedBinance(); openWS(); }catch(e){ addLog('Seed error (REST). Użyj Tryb: Symulacja.'); } }
    else startSim();
  }
  document.getElementById('reload').onclick=reload;
  document.getElementById('start').onclick =()=>{ running=true };
  document.getElementById('stop').onclick  =()=>{ running=false };
  document.getElementById('reset').onclick =()=>{ running=false; position='FLAT'; entryPx=0; equity=[{t:Math.floor(Date.now()/1000), v:10000}]; trades=[]; logs=[]; logEl.textContent=''; posEl.textContent='FLAT'; upnlEl.textContent='0.00'; renderAll(); };
  document.getElementById('export').onclick=()=>{ const rows=[['time','type','price','size','equity']].concat(trades.map(t=>[new Date(t.time).toISOString(),t.type,t.price,t.size,t.equity])); const csv=rows.map(r=>r.join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='trades.csv'; a.click(); URL.revokeObjectURL(a.href); };
  document.getElementById('clearLog').onclick=()=>{ logs=[]; logEl.textContent=''; };

  modeSel.onchange =()=>{ mode=modeSel.value; reload() };
  symSel.onchange  =()=>{ symbol=symSel.value; reload() };
  intSel.onchange  =()=>{ interval=intSel.value; reload() };

  reload();
})();
</script>
</html>
