<!doctype html><meta charset="utf-8"><title>ElBotto — Binance Live</title>
<div style="padding:12px;font-family:system-ui">
  <h1 style="margin:0 0 6px">Binance Live</h1>
  <div>Symbol <select id="symbol"><option>BTCUSDT</option><option>ETHUSDT</option><option>BNBUSDT</option><option>SOLUSDT</option></select>
       Interwał <select id="interval"><option>1m</option><option>5m</option><option>15m</option><option>1h</option></select>
       <span id="status" style="margin-left:8px;color:#888">● offline</span>
  </div>
  <div style="font-size:32px;font-weight:700;margin:6px 0" id="price">—</div>
  <svg id="chart" viewBox="0 0 1000 360" style="width:100%;height:360px;border:1px solid #eee"></svg>
</div>
<script>
(function(){
  const symSel=document.getElementById('symbol');
  const intSel=document.getElementById('interval');
  const priceEl=document.getElementById('price');
  const statusEl=document.getElementById('status');
  const svg=document.getElementById('chart');
  let ws=null, symbol=symSel.value, interval=intSel.value;
  const series=[];

  function setStatus(ok,msg=''){ statusEl.textContent=(ok?'● connected':'● offline')+(msg?' — '+msg:''); statusEl.style.color= ok? '#16a34a' : '#ef4444'; }
  function render(){ const w=1000,h=360,N=series.length; if(N<2){ svg.innerHTML=''; return }
    const min=Math.min(...series),max=Math.max(...series),pad=(max-min)*0.1||1;
    const yMin=min-pad,yMax=max+pad,xStep=w/(N-1),Y=v=>h-((v-yMin)/(yMax-yMin))*h;
    let d='M 0 '+Y(series[0]); for(let i=1;i<N;i++) d+=' L '+(i*xStep)+' '+Y(series[i]);
    svg.innerHTML=`<rect x="0" y="0" width="${w}" height="${h}" fill="#fff"/><path d="${d}" stroke="#0ea5e9" stroke-width="2" fill="none"/>`;
  }
  async function seed(){ const url=`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=150`;
    try{ const arr=await fetch(url).then(r=>r.json()); series.length=0; arr.forEach(k=>series.push(Number(k[4]))); priceEl.textContent=series.at(-1).toFixed(2); render(); }catch(e){}
  }
  function openWS(){ try{ws&&ws.close()}catch{}; const stream=symbol.toLowerCase()+'@kline_'+interval;
    ws=new WebSocket('wss://stream.binance.com:9443/ws/'+stream);
    ws.onopen=()=>setStatus(true, symbol+'/'+interval);
    ws.onmessage=ev=>{ try{ const d=JSON.parse(ev.data); const p=Number(d.k?.c||d.c||d.p); if(!isFinite(p)) return;
      priceEl.textContent=p.toFixed(2); series.push(p); if(series.length>1000) series.shift(); render(); }catch{} };
    ws.onclose =()=>{ setStatus(false); setTimeout(()=>openWS(),1500); };
    ws.onerror =()=> setStatus(false,'error');
  }
  async function reload(){ await seed(); openWS(); }
  symSel.onchange=()=>{ symbol=symSel.value; reload(); };
  intSel.onchange=()=>{ interval=intSel.value; reload(); };
  reload();
})();
</script>
