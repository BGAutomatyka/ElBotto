<!doctype html><html lang="pl"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElBotto — Strategy Lab (Backtest, SVG)</title>
<style>
  :root{
    --bg:#f6f7fb;--card:#fff;--muted:#6b7280;--grid:#eef0f5;
    --up:#10b981;--dn:#ef4444;--pri:#0ea5e9;--acc:#a855f7
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:#0f172a}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .wrap{max-width:1200px;margin:0 auto;padding:12px}
  .card{background:var(--card);border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:12px}
  .muted{color:var(--muted);font-size:12px}
  select,button,input{border:1px solid #d1d5db;border-radius:8px;padding:6px 8px;background:#fff}
  input[type="number"]{width:88px}
  button{cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .kpi{display:flex;gap:12px;flex-wrap:wrap}
  .kpi .pill{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:6px 10px;font-size:12px}
  svg{width:100%}
  pre{white-space:pre-wrap;word-break:break-word;max-height:280px;overflow:auto;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px}
  .group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .hint{border-bottom:1px dotted #94a3b8;cursor:help}
  .sep{height:1px;background:#eef0f5;margin:8px 0}
</style>

<header>
  <div>
    <h1 style="margin:0;font-size:20px">ElBotto — Strategy Lab</h1>
    <div class="muted">Backtest w przeglądarce • Binance REST • świece + markery • equity & drawdown • CSV</div>
  </div>
  <div class="row">
    <label>Symbol
      <select id="symbol" title="Para z Binance (spot)">
        <option>BTCUSDT</option><option>ETHUSDT</option><option>BNBUSDT</option><option>SOLUSDT</option>
      </select>
    </label>
    <label>Interwał
      <select id="interval" title="Interwał świec">
        <option>1m</option><option>5m</option><option>15m</option><option>1h</option>
      </select>
    </label>
    <label>Świec
      <input id="bars" type="number" value="1200" min="100" max="5000" title="Ile ostatnich świec wczytać (max 5000)">
    </label>
    <label>Strategia
      <select id="strategy" title="Wybierz algorytm">
        <option value="ema">EMA Cross</option>
        <option value="rsi">RSI Mean Reversion</option>
        <option value="bb">Bollinger Breakout</option>
      </select>
    </label>
    <button id="run" title="Uruchom backtest">Backtest</button>
    <button id="csv" title="Zapisz transakcje do CSV">Export CSV</button>
    <span id="status" class="muted">● idle</span>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <!-- parametry strategii renderowane dynamicznie -->
    <div id="params" class="row" style="gap:14px"></div>

    <div class="sep"></div>

    <!-- ryzyko / egzekucja -->
    <div class="row" style="gap:18px">
      <div class="group" title="Opłaty i poślizg egzekucji (w punktach bazowych; 1 bps = 0.01%)">
        <span class="muted">Fee <span class="hint" title="Na każdą stronę transakcji (wejście/wyjście)">bps</span></span>
        <input id="p_fee" type="number" value="5" min="0" max="100">
        <span class="muted">Slippage</span>
        <input id="p_slip" type="number" value="2" min="0" max="200">
        <span class="muted">Units</span>
        <input id="p_units" type="number" value="1" step="0.1" min="0">
      </div>
      <div class="group" title="Parametry wyjść obronnych (dla pozycji LONG)">
        <label><input id="p_use_sl" type="checkbox" checked> SL%</label><input id="p_sl" type="number" value="1.0" step="0.1" min="0">
        <label><input id="p_use_tp" type="checkbox" checked> TP%</label><input id="p_tp" type="number" value="1.2" step="0.1" min="0">
        <label><input id="p_use_tr" type="checkbox"> Trailing%</label><input id="p_tr" type="number" value="0.8" step="0.1" min="0">
      </div>
    </div>

    <div class="kpi" style="margin-top:8px">
      <div class="pill">Transakcji: <b id="k_trades">0</b></div>
      <div class="pill">Win rate: <b id="k_win">0%</b></div>
      <div class="pill">PF: <b id="k_pf">—</b></div>
      <div class="pill">Return: <b id="k_ret">0%</b></div>
      <div class="pill">Max DD: <b id="k_dd">0%</b></div>
      <div class="pill">Final Eq: <b id="k_eq">10000</b></div>
    </div>
  </div>

  <div class="grid">
    <div class="card"><svg id="chart" viewBox="0 0 1000 440" preserveAspectRatio="none"></svg></div>
    <div class="card"><svg id="equity" viewBox="0 0 1000 440" preserveAspectRatio="none"></svg></div>
  </div>
  <div class="card"><svg id="drawdown" viewBox="0 0 1000 200" preserveAspectRatio="none"></svg></div>

  <div class="card">
    <div class="muted">Log transakcji</div>
    <pre id="log"></pre>
  </div>
</div>

<script>
(function(){
  // ========= DOM =========
  const symSel=document.getElementById('symbol');
  const intSel=document.getElementById('interval');
  const barsInp=document.getElementById('bars');
  const stratSel=document.getElementById('strategy');
  const runBtn=document.getElementById('run');
  const csvBtn=document.getElementById('csv');
  const statusEl=document.getElementById('status');
  const paramsBox=document.getElementById('params');
  const svg=document.getElementById('chart');
  const svgEq=document.getElementById('equity');
  const svgDD=document.getElementById('drawdown');
  const logEl=document.getElementById('log');

  const k_trades=document.getElementById('k_trades');
  const k_win=document.getElementById('k_win');
  const k_pf=document.getElementById('k_pf');
  const k_ret=document.getElementById('k_ret');
  const k_dd=document.getElementById('k_dd');
  const k_eq=document.getElementById('k_eq');

  // ========= Utils =========
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const mapK=a=>a.map(k=>({t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5]}));
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));

  async function fetchKlines(symbol, interval, candles){
    // pobieramy partiami do limitu 1000, cofając się w czasie
    const out=[]; let end=null;
    while(out.length < candles){
      const need=candles - out.length; const limit=Math.min(1000, need);
      const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}` + (end?`&endTime=${end}`:'');
      const res = await fetch(url);
      const json = await res.json();
      if(!Array.isArray(json) || !json.length) break;
      const batch = mapK(json);
      if(out.length && batch.length && batch[0].t === out[0]?.t) break; // anty pętla
      out.unshift(...batch);
      end = batch[0].t - 1;
      await sleep(70); // lekki throttling
      if(batch.length < limit) break;
    }
    return out.slice(-candles);
  }

  // ========= Indykatory =========
  const SMA=(arr,n,sel)=>(()=>{const out=[];let s=0;for(let i=0;i<arr.length;i++){s+=sel(arr[i]); if(i>=n) s-=sel(arr[i-n]); if(i>=n-1) out.push({t:arr[i].t,v:s/n})}return out})();
  const EMA=(arr,n,sel)=>(()=>{const out=[];const k=2/(n+1); let e=sel(arr[0]); for(let i=0;i<arr.length;i++){ e=i?(sel(arr[i])*k + e*(1-k)):sel(arr[0]); out.push({t:arr[i].t,v:e}) } return out})();
  function RSI(arr,n,sel){ if(arr.length<n+1) return []; const out=[]; let g=0,l=0;
    for(let i=1;i<=n;i++){ const d=sel(arr[i])-sel(arr[i-1]); if(d>0) g+=d; else l-=d }
    let aG=g/n, aL=l/n; out.push({t:arr[n].t, v:100-100/(1+(aG/(aL||1e-9)))});
    for(let i=n+1;i<arr.length;i++){ const d=sel(arr[i])-sel(arr[i-1]); const G=d>0?d:0, L=d<0?-d:0; aG=(aG*(n-1)+G)/n; aL=(aL*(n-1)+L)/n; out.push({t:arr[i].t, v:100-100/(1+(aG/(aL||1e-9)))}) }
    return out;
  }
  function BB(arr,n,m,sel){
    const out=[]; const values=arr.map(sel);
    for(let i=n-1;i<values.length;i++){
      const slice = values.slice(i-n+1, i+1);
      const mean = slice.reduce((a,b)=>a+b,0)/n;
      const std = Math.sqrt(slice.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n);
      out.push({t:arr[i].t, mid:mean, up:mean+m*std, dn:mean-m*std});
    }
    return out;
  }

  // ========= UI parametrów =========
  function renderParams(){
    const t=stratSel.value;
    if(t==='ema'){
      paramsBox.innerHTML = `
        <label>EMA fast <input id="p_fast" type="number" value="21" min="2" max="200" style="width:80px"></label>
        <label>EMA slow <input id="p_slow" type="number" value="50" min="3" max="500" style="width:80px"></label>
      `;
    } else if(t==='rsi'){
      paramsBox.innerHTML = `
        <label>RSI <input id="p_len" type="number" value="14" min="2" max="100" style="width:80px"></label>
        <label>Oversold <input id="p_os" type="number" value="30" min="1" max="50" style="width:80px"></label>
        <label>Overbought <input id="p_ob" type="number" value="70" min="50" max="99" style="width:80px"></label>
      `;
    } else {
      paramsBox.innerHTML = `
        <label>BB period <input id="p_len" type="number" value="20" min="5" max="200" style="width:80px"></label>
        <label>BB mult <input id="p_mult" type="number" value="2" step="0.1" min="0.5" max="5" style="width:80px"></label>
      `;
    }
  }
  stratSel.onchange=renderParams; renderParams();

  // ========= Backtest core (LONG/FLAT) =========
  function backtest(candles, signalFn, risk){
    const trades=[], equity=[], logs=[];
    let pos=0, entry=0, entryBar=-1, highSince=0; // trailing
    let eq=10000;
    const units = Math.max(0, +document.getElementById('p_units').value || 1);

    const feeMult = bps => (bps/10000);
    const execBuy  = px => px*(1 + risk.slipBps/10000);
    const execSell = px => px*(1 - risk.slipBps/10000);

    for(let i=1;i<candles.length;i++){
      const c=candles[i]; // {o,h,l,c,t}
      // trailing update (dla LONG)
      if(pos===1){ highSince = Math.max(highSince, c.h); }

      // Wyjścia obronne intra-bar (kolejność: SL -> Trailing -> TP; konserwatywnie)
      if(pos===1){
        const tpPx = risk.useTP ? entry*(1 + risk.tpPct/100) : Infinity;
        const slPx = risk.useSL ? entry*(1 - risk.slPct/100) : -Infinity;
        const trPx = risk.useTR ? highSince*(1 - risk.trPct/100) : -Infinity;

        let exitReason=null, exitPx=null;
        if (risk.useSL && c.l <= slPx){ exitReason='SL'; exitPx=slPx; }
        else if (risk.useTR && c.l <= trPx){ exitReason='TRAIL'; exitPx=trPx; }
        else if (risk.useTP && c.h >= tpPx){ exitReason='TP'; exitPx=tpPx; }

        if(exitPx!=null){
          const px = execSell(exitPx);
          const pnl = (px - entry) * units;
          const fee = (entry * feeMult(risk.feeBps) + px * feeMult(risk.feeBps)) * units;
          eq += (pnl - fee);
          trades.push({time:c.t,type:'SELL',price:+px.toFixed(8),pnl:+pnl.toFixed(2),reason:exitReason,eqAfter:+eq.toFixed(2)});
          logs.push(`${exitReason} SELL @ ${px.toFixed(2)} | PnL ${pnl.toFixed(2)} | Fee ${fee.toFixed(2)} | Eq ${eq.toFixed(2)}`);
          pos=0; entry=0; entryBar=-1; highSince=0;
        }
      }

      // Sygnał algorytmu (po ewentualnych wyjściach risk)
      const sig = signalFn(i, candles); // BUY | FLAT | HOLD
      if(sig==='BUY' && pos===0){
        const raw = c.c; const px = execBuy(raw);
        const fee = (px * feeMult(risk.feeBps)) * units;
        eq -= fee; // opłata wejścia
        pos=1; entry=px; entryBar=i; highSince=c.h;
        trades.push({time:c.t,type:'BUY',price:+px.toFixed(8),eqAfter:+eq.toFixed(2)});
        logs.push(`BUY @ ${px.toFixed(2)} | Fee ${fee.toFixed(2)} | Eq ${eq.toFixed(2)}`);
      } else if(sig==='FLAT' && pos===1){
        const px = execSell(c.c);
        const pnl = (px - entry) * units;
        const fee = (px * feeMult(risk.feeBps)) * units;
        eq += (pnl - fee);
        trades.push({time:c.t,type:'SELL',price:+px.toFixed(8),pnl:+pnl.toFixed(2),reason:'Signal',eqAfter:+eq.toFixed(2)});
        logs.push(`Signal SELL @ ${px.toFixed(2)} | PnL ${pnl.toFixed(2)} | Fee ${fee.toFixed(2)} | Eq ${eq.toFixed(2)}`);
        pos=0; entry=0; entryBar=-1; highSince=0;
      }

      // Equity (co bar) = realised eq + uPnL
      const upnl = pos ? (c.c - entry) * units : 0;
      equity.push({t:c.t, v: +(eq + upnl).toFixed(2)});
    }

    // Domknięcie EOD
    const last=candles[candles.length-1];
    if(pos===1){
      const px = execSell(last.c);
      const pnl=(px-entry) * units;
      const fee=(px * (risk.feeBps/10000)) * units;
      eq += (pnl - fee);
      trades.push({time:last.t,type:'SELL',price:+px.toFixed(8),pnl:+pnl.toFixed(2),reason:'EOD',eqAfter:+eq.toFixed(2)});
      logs.push(`EOD SELL @ ${px.toFixed(2)} | PnL ${pnl.toFixed(2)} | Fee ${fee.toFixed(2)} | Eq ${eq.toFixed(2)}`);
      equity[equity.length-1] = {t:last.t, v:+eq.toFixed(2)};
    }

    return {trades, equity, logs};
  }

  // ========= Strategie =========
  function stratEMA(params, candles){
    const fast=clamp(+params.fast||21,2,500);
    const slow=clamp(+params.slow||50,3,1000);
    const efast=EMA(candles, fast, d=>d.c), eslow=EMA(candles, slow, d=>d.c);
    return (i)=>{
      if (i <= 0) return 'HOLD';
      const a = efast[i]?.v, b = eslow[i]?.v;
      const ap = efast[i-1]?.v, bp = eslow[i-1]?.v;
      if (a==null || b==null || ap==null || bp==null) return 'HOLD';
      if (a > b && ap <= bp) return 'BUY';
      if (a < b && ap >= bp) return 'FLAT';
      return 'HOLD';
    };
  }
  function stratRSI(params, candles){
    const len=clamp(+params.len||14,2,100), os=clamp(+params.os||30,1,50), ob=clamp(+params.ob||70,50,99);
    const r = RSI(candles, len, d=>d.c);
    const offset = candles.length - r.length;
    return (i)=>{ const k=i-offset; if(k<=0) return 'HOLD';
      const v=r[k]?.v, pv=r[k-1]?.v; if(v==null||pv==null) return 'HOLD';
      if(pv<os && v>=os) return 'BUY';     // wyjście z oversold => wejście LONG
      if(pv>50 && v<=50) return 'FLAT';    // powrót pod środek => out
      if(v>ob) return 'FLAT';              // zabezpieczenie w strefie wykupienia
      return 'HOLD';
    };
  }
  function stratBB(params, candles){
    const len=clamp(+params.len||20,5,200), mult=clamp(+params.mult||2,0.5,5);
    const bb = BB(candles, len, mult, d=>d.c);
    const offset = candles.length - bb.length;
    return (i)=>{ const k=i-offset; if(k<1) return 'HOLD';
      const c=candles[i].c, p=candles[i-1].c, b=bb[k], pb=bb[k-1]; if(!b||!pb) return 'HOLD';
      if(p<=pb.up && c>b.up) return 'BUY'; // wybicie górą
      if(c<b.mid) return 'FLAT';           // powrót pod średnią
      return 'HOLD';
    };
  }

  // ========= Rysowanie (SVG) =========
  function renderCandlesSVG(target, candles, trades){
    const W=1000,H=440,N=candles.length, xStep=W/(N-1);
    const min=Math.min(...candles.map(d=>d.l)), max=Math.max(...candles.map(d=>d.h));
    const pad=(max-min)*0.05||1, yMin=min-pad, yMax=max+pad, Y=v=> H-((v-yMin)/(yMax-yMin))*H;
    let parts=[`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`];
    for(let i=1;i<6;i++){ const y=i*(H/6); parts.push(`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--grid)"/>`) }
    for(let i=0;i<N;i++){
      const d=candles[i], x=i*xStep, yO=Y(d.o), yC=Y(d.c), yH=Y(d.h), yL=Y(d.l), up=d.c>=d.o;
      const col=up?'var(--up)':'var(--dn)'; const w=Math.max(1.5,xStep*0.6), x0=x-w/2, yB=Math.min(yO,yC), h=Math.max(1,Math.abs(yC-yO));
      parts.push(`<line x1="${x}" y1="${yH}" x2="${x}" y2="${yL}" stroke="${col}" stroke-width="1"/>`);
      parts.push(`<rect x="${x0}" y="${yB}" width="${w}" height="${h}" fill="${col}" opacity="0.9"/>`);
    }
    // Markery transakcji
    for(const t of trades){
      const i = candles.findIndex(c=>c.t===t.time); if(i<0) continue;
      const x=i*xStep, y=Y(t.price), col=(t.type==='BUY'?'var(--up)':'var(--dn)');
      parts.push(`<polygon points="${x-6},${y+8} ${x+6},${y+8} ${x},${y-6}" fill="${col}" stroke="#00000011"/>`);
    }
    target.innerHTML = parts.join('');
  }

  function renderLine(target, series, color='var(--pri)', W=1000, H=440){
    if(!series.length){ target.innerHTML=''; return }
    const min=Math.min(...series), max=Math.max(...series), pad=(max-min)*0.05||1, yMin=min-pad, yMax=max+pad, xStep=W/(series.length-1), Y=v=> H-((v-yMin)/(yMax-yMin))*H;
    let d=`M 0 ${Y(series[0])}`; for(let i=1;i<series.length;i++){ d+=` L ${i*xStep} ${Y(series[i])}` }
    target.innerHTML = `<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/><path d="${d}" stroke="${color}" stroke-width="2" fill="none"/>`;
  }

  function renderDD(target, eq){
    if(eq.length<2){ target.innerHTML=''; return 0 }
    const vals=eq.map(e=>e.v); let peak=vals[0]; const dd=vals.map(v=>{ peak=Math.max(peak,v); return (v-peak)/peak*100 });
    const W=1000,H=200,xStep=W/(dd.length-1), min=Math.min(...dd), max=Math.max(...dd), pad=1, yMin=min-pad, yMax=max+pad, Y=v=> H-((v-yMin)/(yMax-yMin))*H;
    let d=`M 0 ${Y(dd[0])}`; for(let i=1;i<dd.length;i++){ d+=` L ${i*xStep} ${Y(dd[i])}` }
    target.innerHTML = `<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/><path d="${d}" stroke="var(--dn)" stroke-width="2" fill="none"/>`;
    return Math.min(...dd);
  }

  // ========= CSV =========
  function downloadCSV(trades){
    const rows=[['time','type','price','pnl','reason','eqAfter']]
      .concat(trades.map(t=>[new Date(t.time).toISOString(), t.type, t.price, t.pnl??'', t.reason??'', t.eqAfter??'']));
    const csv=rows.map(r=>r.join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='backtest_trades.csv'; a.click(); URL.revokeObjectURL(a.href);
  }

  // ========= RUN =========
  function readRisk(){
    return {
      feeBps:+document.getElementById('p_fee').value||0,
      slipBps:+document.getElementById('p_slip').value||0,
      useSL:document.getElementById('p_use_sl').checked,
      slPct:+document.getElementById('p_sl').value||0,
      useTP:document.getElementById('p_use_tp').checked,
      tpPct:+document.getElementById('p_tp').value||0,
      useTR:document.getElementById('p_use_tr').checked,
      trPct:+document.getElementById('p_tr').value||0,
    };
  }

  async function run(){
    statusEl.textContent='● pobieram…'; statusEl.style.color='#6b7280';
    const symbol=symSel.value, interval=intSel.value, candles=+barsInp.value;
    const kl=await fetchKlines(symbol,interval,candles);
    if(kl.length<50){ statusEl.textContent='● za mało danych'; statusEl.style.color='#ef4444'; return }

    // strategia + params
    let signalFn;
    if(stratSel.value==='ema'){
      signalFn = stratEMA({fast:+(document.getElementById('p_fast').value||21), slow:+(document.getElementById('p_slow').value||50)}, kl);
    } else if(stratSel.value==='rsi'){
      signalFn = stratRSI({len:+(document.getElementById('p_len').value||14), os:+(document.getElementById('p_os').value||30), ob:+(document.getElementById('p_ob').value||70)}, kl);
    } else {
      signalFn = stratBB ({len:+(document.getElementById('p_len').value||20), mult:+(document.getElementById('p_mult').value||2)}, kl);
    }

    statusEl.textContent='● testuję…';
    const risk = readRisk();
    const {trades, equity, logs} = backtest(kl, signalFn, risk);

    // metryki
    const eqVals=equity.map(e=>e.v);
    const ret=((eqVals.at(-1)-eqVals[0])/eqVals[0]*100)||0;
    let peak=eqVals[0], maxDD=0; for(const v of eqVals){ peak=Math.max(peak,v); maxDD=Math.min(maxDD,(v-peak)/peak*100) }
    const prof = trades.filter(t=>(t.pnl||0)>0), loss = trades.filter(t=>(t.pnl||0)<0);
    const wins = prof.length, losses=loss.length;
    const pf = (prof.reduce((a,b)=>a+(b.pnl||0),0)||0) / Math.abs(loss.reduce((a,b)=>a+(b.pnl||0),0)||1);

    k_trades.textContent=trades.length.toString();
    k_win.textContent=((wins/(wins+losses||1))*100).toFixed(1)+'%';
    k_pf.textContent = isFinite(pf)? pf.toFixed(2) : '—';
    k_ret.textContent=ret.toFixed(2)+'%';
    k_dd .textContent=maxDD.toFixed(2)+'%';
    k_eq .textContent=eqVals.at(-1).toFixed(2);

    // rysunki
    renderCandlesSVG(svg, kl, trades);
    renderLine(svgEq, eqVals, 'var(--pri)');
    renderDD(svgDD, equity);

    logEl.textContent = logs.join('\n');
    statusEl.textContent='● done'; statusEl.style.color='#16a34a';

    csvBtn.onclick=()=>downloadCSV(trades);
  }

  runBtn.onclick=run;
})();
</script>
</html>
