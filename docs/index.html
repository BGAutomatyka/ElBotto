<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Alpha Bot — no-build demo</title>
<style>body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial;margin:16px;background:#f7f8fb;} .card{border:1px solid #e5e7eb;border-radius:14px;padding:16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.05);} .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));} .muted{color:#6b7280;font-size:12px}</style>
</head>
<body>
  <h1 style="margin:0">Alpha Bot (Pages no-build)</h1>
  <p class="muted">Działa bez Node/Vite — czysty CDN. To wersja awaryjna, by od razu zobaczyć stronę na GitHub Pages.</p>
  <div id="root"></div>
  <script type="module">
    import React from 'https://esm.sh/react@18.3.1'
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client'

    function useAlphaSim(){
      const [price,setPrice]=React.useState(100)
      const [equity,setEquity]=React.useState(10000)
      const [pos,setPos]=React.useState(0)
      const [log,setLog]=React.useState([])
      const mu=100, vol=0.6, thr=1.2, sl=2, tp=2, trailing=1
      const best=React.useRef(null)
      React.useEffect(()=>{
        const id=setInterval(()=>{
          const drift=(mu-price)*0.05
          const shock=(Math.random()-0.5)*vol*2
          const p=Math.max(0.1, price+drift+shock)
          setPrice(p)
          const z=p-mu
          if(pos===0){
            if(z>thr){ setPos(-1); setLog(l=>['SELL',...l]) }
            if(z<-thr){ setPos( 1); setLog(l=>['BUY', ...l]) }
            best.current=p
          }else{
            if(pos>0) best.current=Math.max(best.current??p,p)
            if(pos<0) best.current=Math.min(best.current??p,p)
            const trailHit = pos>0 ? (best.current-p)>=trailing : (p-best.current)>=trailing
            const pnl=(p-price)*pos
            if(Math.abs(z)<0.2 || pnl<=-sl || pnl>=tp || trailHit){
              setEquity(e=>e+(p-price)*pos)
              setPos(0)
              setLog(l=>['FLAT',...l])
              best.current=null
            }
          }
        },300)
        return ()=>clearInterval(id)
      },[price,pos])
      return {price,equity,pos,log}
    }

    function Card({title,children}){
      return React.createElement('div',{className:'card'},[
        React.createElement('div',{className:'muted'},title),
        React.createElement('div',{style:{fontSize:'28px',fontWeight:600,marginTop:8}},children)
      ])
    }

    function App(){
      const {price,equity,pos,log}=useAlphaSim()
      const posTxt=pos===1?'LONG':pos===-1?'SHORT':'FLAT'
      return React.createElement(React.Fragment,null,[
        React.createElement('div',{className:'grid',style:{marginTop:16}},[
          React.createElement(Card,{title:'Cena'}, price.toFixed(2)),
          React.createElement(Card,{title:'Pozycja'}, posTxt),
          React.createElement(Card,{title:'Equity'}, equity.toFixed(2)),
        ]),
        React.createElement('h3',{style:{marginTop:16}},'Log'),
        React.createElement('ul',null, log.slice(0,30).map((e,i)=> React.createElement('li',{key:i}, e)))
      ])
    }

    createRoot(document.getElementById('root')).render(React.createElement(App))
  </script>
</body>
</html>
